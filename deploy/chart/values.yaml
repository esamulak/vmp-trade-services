appName: vmp-trade-services

replicaCount: 1

image:
  repository: vmp-trade-services
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    httpGet:
      path: /api/actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readiness:
    httpGet:
      path: /api/actuator/health/readiness
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

postgres:
  host: postgres
  port: 5432
  database: vmp
  schema: trade

securityContext:
  automountServiceAccountToken: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile: RuntimeDefault
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL