appName: vmp-trade-services

replicaCount: 1

image:
  repository: vmp-trade-services
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgres:
  host: postgres
  port: 5432
  database: vmp